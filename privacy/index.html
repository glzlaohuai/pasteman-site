<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PasteMan</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script>
      (function () {
        var supported = ["en", "zh-Hans", "zh-Hant", "ja", "ko", "de", "fr", "es"];
        function pick(tag) {
          tag = (tag || "").toLowerCase();
          if (tag.indexOf("zh") === 0) {
            return /hant|tw|hk|mo/.test(tag) ? "zh-Hant" : "zh-Hans";
          }
          var base = tag.split("-")[0];
          return supported.indexOf(base) >= 0 ? base : null;
        }
        var found = "en";
        var tags = navigator.languages || [navigator.language];
        for (var i = 0; i < tags.length; i++) {
          var match = pick(tags[i]);
          if (match) { found = match; break; }
        }
        location.replace("/" + found + "/privacy/" + location.hash);
      })();
    </script>
  </head>
  <body>
    <main class="doc">
      <ul>
      <li><a href="/en/privacy/" hreflang="en">English</a></li>
      <li><a href="/zh-Hans/privacy/" hreflang="zh-Hans">简体中文</a></li>
      <li><a href="/zh-Hant/privacy/" hreflang="zh-Hant">繁體中文</a></li>
      <li><a href="/ja/privacy/" hreflang="ja">日本語</a></li>
      <li><a href="/ko/privacy/" hreflang="ko">한국어</a></li>
      <li><a href="/de/privacy/" hreflang="de">Deutsch</a></li>
      <li><a href="/fr/privacy/" hreflang="fr">Français</a></li>
      <li><a href="/es/privacy/" hreflang="es">Español</a></li>
      </ul>
    </main>
  </body>
</html>
